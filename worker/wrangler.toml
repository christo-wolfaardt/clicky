name = "clicky-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
# Pick a voice in ElevenLabs → Voices and paste its Voice ID
ELEVENLABS_VOICE_ID = "PASTE_YOUR_ELEVENLABS_VOICE_ID_HERE"

# Personal access codes and daily usage counters. Create the namespace once with
#   npx wrangler kv namespace create CLICKY_USERS
# and paste the id it prints below.
[[kv_namespaces]]
binding = "CLICKY_USERS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
